{{define "notes-form"}}
<div class="mb-8">
  <div class="flex items-center justify-between">
    <div>
      {{if .IsEdit}}
      <h1 class="text-3xl font-bold text-white">Edit Note</h1>
      <p class="text-base text-white mt-2">Update your note</p>
      {{else}}
      <h1 class="text-3xl font-bold text-white">New Note</h1>
      <p class="text-base text-white mt-2">Create a new note</p>
      {{end}}
    </div>
    <a href="/nimda/notes" class="text-white hover:text-amber-100">← Back to notes</a>
  </div>
</div>

{{if .Error}}
<div class="bg-red-50 border border-red-200 rounded-lg p-4 mb-6">
  <p class="text-red-800">{{.Error}}</p>
</div>
{{end}}

<form method="POST" {{if .IsEdit}} action="/nimda/notes/{{.ID}}" {{else}} action="/nimda/notes" {{end}}
  class="bg-white rounded-lg shadow">
  <div class="p-6 space-y-6">
    <!-- Title -->
    <div>
      <label for="title" class="block text-sm font-medium text-gray-700 mb-2">Title *</label>
      <input type="text" id="title" name="title" value="{{.Note.Title}}" required
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-yellow-500 focus:border-transparent"
        placeholder="Enter note title">
    </div>

    <!-- Content -->
    <div>
      <label for="content" class="block text-sm font-medium text-gray-700 mb-2">Content *</label>
      <div class="flex gap-4 mb-2">
        <button type="button" onclick="switchTab('write')" id="write-tab"
          class="px-3 py-1 text-sm rounded bg-gray-200">Write</button>
        <button type="button" onclick="switchTab('preview')" id="preview-tab"
          class="px-3 py-1 text-sm rounded bg-gray-100">Preview</button>
      </div>
      <div id="write-panel" class="block">
        <textarea id="content" name="content" rows="20" required
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-yellow-500 focus:border-transparent font-mono"
          placeholder="Write your note content in Markdown...">{{.Note.Content}}</textarea>
      </div>
      <div id="preview-panel" class="hidden">
        <div id="preview-content" class="w-full px-4 py-2 border border-gray-300 rounded-lg min-h-96 bg-gray-50"></div>
      </div>
      <p class="text-sm text-gray-500 mt-1">Supports Markdown formatting</p>
    </div>

    <!-- Tags -->
    <div>
      <label for="tags" class="block text-sm font-medium text-gray-700 mb-2">Tags</label>
      <input type="text" id="tags" name="tags" value="{{.Note.Tags}}"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
        placeholder="tag1, tag2, tag3">
      <p class="text-sm text-gray-500 mt-1">Comma-separated tags</p>
    </div>

    <!-- Status -->
    <div>
      <label for="status" class="block text-sm font-medium text-gray-700 mb-2">Status</label>
      <select id="status" name="status"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-yellow-500 focus:border-transparent">
        <option value="draft" {{if eq .Note.Status "draft" }}selected{{end}}>Draft</option>
        <option value="published" {{if eq .Note.Status "published" }}selected{{end}}>Published</option>
      </select>
    </div>
  </div>

  <div class="px-6 py-4 bg-gray-50 border-t border-gray-200 flex justify-between">
    <a href="/nimda/notes" class="px-4 py-2 text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50">
      Cancel
    </a>
    <button type="submit" class="px-4 py-2 bg-yellow-600 text-white rounded-lg hover:bg-yellow-700">
      {{if .IsEdit}}Update{{else}}Create{{end}} Note
    </button>
  </div>
</form>

<script>
  function switchTab(tab) {
    if (tab === 'write') {
      document.getElementById('write-tab').classList.add('bg-gray-200');
      document.getElementById('write-tab').classList.remove('bg-gray-100');
      document.getElementById('preview-tab').classList.add('bg-gray-100');
      document.getElementById('preview-tab').classList.remove('bg-gray-200');
      document.getElementById('write-panel').classList.remove('hidden');
      document.getElementById('preview-panel').classList.add('hidden');
    } else {
      document.getElementById('write-tab').classList.add('bg-gray-100');
      document.getElementById('write-tab').classList.remove('bg-gray-200');
      document.getElementById('preview-tab').classList.add('bg-gray-200');
      document.getElementById('preview-tab').classList.remove('bg-gray-100');
      document.getElementById('write-panel').classList.add('hidden');
      document.getElementById('preview-panel').classList.remove('hidden');

      // Simple markdown preview
      const content = document.getElementById('content').value;
      let html = content
        .replace(/^### (.*$)/gim, '<h3 class="text-lg font-semibold mt-4 mb-2">$1</h3>')
        .replace(/^## (.*$)/gim, '<h2 class="text-xl font-semibold mt-4 mb-2">$1</h2>')
        .replace(/^# (.*$)/gim, '<h1 class="text-2xl font-bold mt-4 mb-2">$1</h1>')
        .replace(/\*\*(.*)\*\*/gim, '<strong>$1</strong>')
        .replace(/\*(.*)\*/gim, '<em>$1</em>')
        .replace(/\[(.*)\]\((.*)\)/gim, '<a href="$2" class="text-blue-600 hover:underline">$1</a>')
        .replace(/\n/gim, '<br>');
      document.getElementById('preview-content').innerHTML = html;
    }
  }
</script>
{{end}}
