{{define "admin_login"}}
<!DOCTYPE html>
<html lang="en">

<head>
  <title>EdwardJPT page</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="EdwardJPT's website page">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="icon" href="/static/images/logo.webp">
  <link rel="stylesheet" type="text/css" href="/static/css/index.css">
  <link rel="stylesheet" type="text/css" href="/static/css/output.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
</head>

<body>
  <main class="flex h-screen w-screen flex-col justify-center items-center bg-background font-sans text-slate-200">
    <div class="overflow-hidden rounded-2xl bg-white shadow-xl transition-all duration-300 hover:shadow-2xl">
      <form action="/nimda" method="POST" id="form" class="py-4 px-8">
        {{ if eq .Message "" }}
        <p></p>
        {{ else }}
        <p class="my-2 text-background py-2 text-lg w-full text-center font-bold">
          {{ .Message }}
        </p>
        {{ end }}
        <!-- Username Input -->
        <div class="mb-6">
          <label for="username" class="mb-2 block text-sm font-medium text-gray-700">Username</label>
          <div class="relative">
            <input type="username" id="username" placeholder="username" name="username"
              class="input-focus w-full rounded-lg border border-gray-300 py-3 pr-4 pl-4 text-background transition focus:ring-0 focus:outline-none"
              required>
          </div>
        </div>

        <!-- Password Input -->
        <div class="mb-6">
          <div class="mb-2 flex items-center justify-between">
            <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
            <a href="#" class="text-sm text-background transition hover:text-background/80">Forgot password?</a>
          </div>
          <div class="relative">
            <input type="password" id="password" placeholder="••••••••" name="password"
              class="input-focus w-full rounded-lg border border-gray-300 py-3 pr-4 pl-4 text-background transition focus:ring-0 focus:outline-none"
              required>
          </div>
        </div>

        <!-- Remember Me & Submit -->
        <div class="mb-6 flex items-center justify-between">
          <div class="flex items-center">
            <input id="remember" type="checkbox" name="remember"
              class="h-4 w-4 rounded border-gray-300 text-background focus:ring-background">
            <label for="remember" class="ml-2 block text-sm text-gray-900">Remember me</label>
          </div>
        </div>

        <!-- Login Button -->
        <button type="submit"
          class="w-full rounded-lg bg-background px-4 py-3 font-medium text-white shadow-md hover:bg-hover focus:ring-2 focus:ring-background focus:ring-offset-2 focus:outline-none">
          Sign In
        </button>
      </form>
    </div>
  </main>

  <footer class="bg-background">
    {{template "footer" .}}
  </footer>
</body>

<script></script>

</html>
{{end}}
