# podman-compose.yml (Local Dev)
services:
  nginx:
    image: docker.io/library/nginx:stable
    ports:
      - "3000:3000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/dev/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../web/assets:/usr/share/nginx/html/static
