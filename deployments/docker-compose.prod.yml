# podman-compose.prod.yml (EC2 Production)
services:
  nginx:
    image: docker.io/library/nginx:stable
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.containers.internal:host-gateway"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/prod/default.conf:/etc/nginx/conf.d/default.conf:ro
      # SSL keys exist only on the server, we generate and copy it manually to
      # the server from Cloudflare
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ../web/assets:/usr/share/nginx/html/static:ro
