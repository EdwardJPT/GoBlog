# The Catch-All Block
server {
    listen 80 default_server;
    listen 443 ssl default_server;

    # The underscore acts as a wildcard for any undefined host
    server_name _;

    # Nginx must complete the TLS handshake before it can read
    # the request and drop it. We must provide your SSL keys here
    ssl_certificate /etc/nginx/ssl/cloudflare.crt;
    ssl_certificate_key /etc/nginx/ssl/cloudflare.key;

    # 444 is a special Nginx code that instantly closes the connection
    # without sending any headers back
    return 444;
}

# Redirect all HTTP traffic to HTTPS
server {
    listen 80;
    server_name edward.wtf www.edward.wtf;
    return 301 https://$host$request_uri;
}

# HTTPS Server Block
server {
    listen 443 ssl;
    http2 on; # Enable HTTP/2 (Valid for Nginx 1.25.1+)
    server_name edward.wtf www.edward.wtf;

    server_tokens off;

    ssl_certificate /etc/nginx/ssl/cloudflare.crt;
    ssl_certificate_key /etc/nginx/ssl/cloudflare.key;

    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        # Using 127.0.0.1 because of network_mode: "host"
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;

        # Cloudflare specific headers to pass the real client IP to your Go backend
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin API - IP Whitelisting Example
    location /nimda/ {
        # allow 192.168.1.1; # Replace with your actual IP address
        # deny all;          # Block everyone else
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 502 /502.html;
    location = /502.html {
        root /usr/share/nginx/html/static;
        internal;
    }
}
