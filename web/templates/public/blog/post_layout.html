{{define "published_post_layout"}}
<!DOCTYPE html>
<html lang="en">

<head>
  <title>{{.Title}} - Post | EdwardJPT</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="EdwardJPT's blog post">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="icon" href="/static/images/logo.webp">
  <link rel="stylesheet" type="text/css" href="/static/css/output.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" onload="renderMathInElement(document.body, {
            delimiters: [
                {left: '$$', right: '$$', display: true},
                {left: '$', right: '$', display: false}
            ]
        });">
        </script>
  <style>
    .prose blockquote p:first-child {
      font-weight: bold;
    }

    .katex {
      color: #f8fafc;
      font-size: 1.1em;
    }

    .custom-html-box {
      background-color: rgba(255, 255, 255, 0.05) !important;
      color: white !important;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Crucial for mobile: Prevents raw HTML output from Go's Markdown renderer from breaking the viewport */
    .prose pre,
    .prose table {
      overflow-x: auto;
      max-width: 100%;
      -webkit-overflow-scrolling: touch;
      /* Smooth scrolling on iOS */
    }

    .prose img {
      margin-left: auto;
      margin-right: auto;
      max-width: 100%;
      height: auto;
    }
  </style>
</head>

<body class="bg-background text-white antialiased">
  <nav id="navbar"
    class="fixed top-0 left-0 z-10 flex h-24 w-full items-center justify-center bg-lighter_background font-sans text-white md:relative">
    <div class="flex h-full w-full max-w-7xl flex-row items-center justify-between px-4 sm:px-6 lg:px-8">
      <a href="/blog" class="flex flex-row items-center">
        <img src="/static/images/logo-for-page.png" alt="logo picture" width="30" height="37.5"
          class="h-10 w-6 sm:h-12 sm:w-8" />
        <h2
          class="ml-3 flex w-fit justify-center border-b border-b-white pb-2 text-xl font-light tracking-title sm:text-2xl md:ml-6 text-white text-center">
          EdwardJPT's blog
        </h2>
      </a>

      <button id="nav_links_controller" onclick="toggle_links()" class="cursor-pointer md:hidden"
        aria-label="Toggle navigation menu">
        <div class="mb-1.5 h-0.5 w-7 bg-white"></div>
        <div class="mb-1.5 h-0.5 w-7 bg-white"></div>
        <div class="h-0.5 w-7 bg-white"></div>
      </button>

      <div id="nav_links"
        class="fixed top-24 left-0 hidden w-full flex-col bg-lighter_background border-t border-white/10 md:relative md:top-0 md:flex md:w-auto md:flex-row md:border-none md:bg-transparent">
        <a href="/"
          class="flex items-center justify-center px-5 py-4 text-lg hover:bg-white/5 transition-colors md:mx-1 md:py-3 md:text-xl border-b border-white/5 md:border-none">
          Home
        </a>
        <a href="/blog"
          class="flex items-center justify-center px-5 py-4 text-lg hover:bg-white/5 transition-colors md:mx-1 md:py-3 md:text-xl border-b border-white/5 md:border-none">
          Blog
        </a>
        <a href="/projects"
          class="flex items-center justify-center px-5 py-4 text-lg hover:bg-white/5 transition-colors md:mx-1 md:py-3 md:text-xl border-b border-white/5 md:border-none">
          Projects
        </a>
        <a href="/about"
          class="flex items-center justify-center px-5 py-4 text-lg hover:bg-white/5 transition-colors md:mx-1 md:py-3 md:text-xl">
          About
        </a>
      </div>
    </div>
  </nav>

  <main class="mx-auto w-full max-w-4xl px-4 pt-32 pb-12 sm:px-6 md:py-16 lg:px-8 shadow-sm min-h-screen">
    <header class="font-sans mb-8 border-b border-white/50 pb-6 md:mb-10 md:pb-8">
      <h1 class="mb-3 text-3xl font-semibold tracking-tight text-white leading-tight sm:text-4xl lg:text-5xl">
        {{.Title}}
      </h1>
      <time datetime="{{.PublishedAt}}" class="text-sm font-medium text-zinc-400 sm:text-base block">
        {{formatDate .PublishedAt}}
      </time>
    </header>

    <article
      class="prose prose-zinc prose-invert sm:prose-base lg:prose-lg max-w-none wrap-break-words font-medium md:font-semibold text-white/90">
      {{.Content}}
    </article>

    {{if .Tags}}
    <section class="mt-12 flex flex-wrap items-center gap-3 border-t border-white/10 pt-6">
      <span class="font-bold text-white/75 text-sm sm:text-base">
        Tags:
      </span>
      {{ range split .Tags "," }}
      <a href="/tag/{{ . }}"
        class="border border-white/10 bg-white/5 px-3 py-1 text-sm font-semibold text-slate-100 transition-colors hover:bg-white/10 hover:border-white/30">
        {{ . }}
      </a>
      {{end}}
    </section>
    {{end}}
  </main>

  <footer class="min-w-full bg-background border-t border-white/5">
    {{template "footer" .}}
  </footer>
</body>

<script>
  // Controller to toggle classes rather than inline styles.
  // This prevents bugs where resizing the browser leaves the desktop menu hidden.
  const navLinks = document.getElementById("nav_links");

  const toggle_links = () => {
    navLinks.classList.toggle("hidden");
    navLinks.classList.toggle("flex");
  }
</script>

</html>
{{end}}
