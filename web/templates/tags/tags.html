{{define "tags"}}
<!DOCTYPE html>
<html>

<head>
  <title>Tags | EdwardJPT</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="EdwardJPT's tags page">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="icon" href="/static/images/logo.webp">
  <link rel="stylesheet" type="text/css" href="/static/css/output.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
</head>

<body class="flex min-h-screen max-w-screen flex-col items-center justify-center bg-background">
  <nav id="navbar"
    class="fixed top-0 left-0 z-30 flex h-24 w-full items-center justify-center bg-lighter_background font-sans text-white md:relative">
    <div class="flex h-full w-full max-w-7xl flex-row items-center justify-between px-4 sm:px-6 md:px-8">
      <a href="/tags" class="ml-0 flex flex-row items-center">
        <img src="/static/images/logo-for-page.png" alt="logo picture" width="30" height="37.5"
          class="h-10 w-6 sm:h-14 sm:w-8" />
        <h2
          class="ml-3 flex w-fit justify-center border-b border-b-white pb-2 sm:pb-4 text-xl font-light tracking-widest sm:text-2xl md:ml-6">
          EdwardJPT's tags
        </h2>
      </a>

      <div id="nav_links_controller" onclick="show_links()" class="cursor-pointer md:hidden p-2">
        <div class="mt-1 h-1 w-7 bg-white"></div>
        <div class="mt-1 h-1 w-7 bg-white"></div>
        <div class="mt-1 h-1 w-7 bg-white"></div>
      </div>

      <div id="nav_links"
        class="fixed left-0 top-24 hidden w-full flex-col justify-between md:relative md:top-0 md:flex md:w-fit md:flex-row lg:mr-12 shadow-lg md:shadow-none">
        <a href="/"
          class="mx-0 flex w-full md:w-auto md:min-w-28 items-center justify-center bg-lighter_background px-5 py-3 text-xl hover:bg-hover md:mx-3 border-b border-white/10 md:border-none">
          Home
        </a>
        <a href="/blog"
          class="mx-0 flex w-full md:w-auto md:min-w-28 items-center justify-center bg-lighter_background px-5 py-3 text-xl hover:bg-hover md:mx-3 border-b border-white/10 md:border-none">
          Blog
        </a>
        <a href="/projects"
          class="mx-0 flex w-full md:w-auto md:min-w-28 items-center justify-center bg-lighter_background px-5 py-3 text-xl hover:bg-hover md:mx-3 border-b border-white/10 md:border-none">
          Projects
        </a>
        <a href="/about"
          class="mx-0 flex w-full md:w-auto md:min-w-28 items-center justify-center bg-lighter_background px-5 py-3 text-xl hover:bg-hover md:mx-3">
          About
        </a>
      </div>
    </div>
  </nav>

  <div class="flex flex-col w-full gap-6 flex-1 max-w-3xl min-h-0 overflow-y-auto px-4 sm:px-6 py-12 mt-24 md:mt-0"
    id="inner-scroll">

    <form id="filter-form" method="GET" action="" class="flex items-center flex-wrap gap-3 mb-2 w-full">
      <span class="w-12.5 text-sm text-right sm:text-base font-semibold text-slate-300 mr-2">Show:</span>

      <!-- Post Toggle -->
      <label class="cursor-pointer relative">
        <input type="checkbox" name="type" value="posts" class="peer sr-only" onchange="this.form.submit()">
        <span
          class="px-3 py-1.5 text-xs sm:text-sm font-bold text-slate-300 bg-hover/50 border border-slate-50/20 rounded-xs hover:bg-hover peer-checked:bg-white peer-checked:text-background peer-checked:border-white transition-all duration-200">
          Posts
        </span>
      </label>

      <!-- Note Toggle -->
      <label class="cursor-pointer relative">
        <input type="checkbox" name="type" value="notes" class="peer sr-only" onchange="this.form.submit()">
        <span
          class="px-3 py-1.5 text-xs sm:text-sm font-bold text-slate-300 bg-hover/50 border border-slate-50/20 rounded-xs hover:bg-hover peer-checked:bg-white peer-checked:text-background peer-checked:border-white transition-all duration-200">
          Notes
        </span>
      </label>

      <!-- Bookmark Toggle -->
      <label class="cursor-pointer relative">
        <input type="checkbox" name="type" value="bookmarks" class="peer sr-only" onchange="this.form.submit()">
        <span
          class="px-3 py-1.5 text-xs sm:text-sm font-bold text-slate-300 bg-hover/50 border border-slate-50/20 rounded-xs hover:bg-hover peer-checked:bg-white peer-checked:text-background peer-checked:border-white transition-all duration-200">
          Bookmarks
        </span>
      </label>

      <!-- Projects Toggle -->
      <label class="cursor-pointer relative">
        <input type="checkbox" name="type" value="projects" class="peer sr-only" onchange="this.form.submit()">
        <span
          class="px-3 py-1.5 text-xs sm:text-sm font-bold text-slate-300 bg-hover/50 border border-slate-50/20 rounded-xs hover:bg-hover peer-checked:bg-white peer-checked:text-background peer-checked:border-white transition-all duration-200">
          Projects
        </span>
      </label>

      <!-- Open Source Contributions Toggle -->
      <label class="cursor-pointer relative">
        <input type="checkbox" name="type" value="opensource_contributions" class="peer sr-only"
          onchange="this.form.submit()">
        <span
          class="px-3 py-1.5 text-xs sm:text-sm font-bold text-slate-300 bg-hover/50 border border-slate-50/20 rounded-xs hover:bg-hover peer-checked:bg-white peer-checked:text-background peer-checked:border-white transition-all duration-200">
          Open Source
        </span>
      </label>
    </form>

    <div class="flex flex-wrap justify-center gap-3 max-w-3xl mx-auto">
      {{range .Tags}}
      <a href="/tag/{{.Name}}"
        class="flex w-fit items-center justify-center p-2 text-white bg-hover hover:bg-hover/75 font-medium hover:font-semibold transition cursor-pointer">
        <span class="text-base">{{.Name}}</span>
        <span class="ml-2 text-sm">{{.Count}}</span>
      </a>
      {{else}}
      <!-- Optional: Fallback state if the Tags slice is empty -->
      <div class="col-span-full mt-2 text-lg font-semibold text-white">
        No tags available.
      </div>
      {{end}}
    </div>

  </div>

  <section class="min-w-full bg-background">
    {{template "footer" .}}
  </section>

  <script>
    // controller to show the nav links in small screen
    const navLinks = document.getElementById("nav_links");
    const navLinksController = document.getElementById("nav_links_controller");
    const show_links = () => {
      let display = navLinks.style.display;
      if (display == "" || display == "none") {
        navLinks.style.display = "flex";
      } else {
        navLinks.style.display = "none";
      }
    }
  </script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const types = urlParams.getAll("type");
      const filterForm = document.getElementById("filter-form");
      const checkboxes = document.querySelectorAll("#filter-form input[name='type']");

      // If no types are selected in the URL, default to checking both
      if (types.length === 0) {
        checkboxes.forEach(cb => cb.checked = true);
      } else {
        checkboxes.forEach(cb => cb.checked = types.includes(cb.value));
      }
    });
  </script>
</body>

</html>
{{end}}
