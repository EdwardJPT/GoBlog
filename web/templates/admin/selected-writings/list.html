{{define "writings-list"}}
<div class="bg-white rounded-lg shadow overflow-hidden">
  {{if .Writings}}
  <table class="min-w-full divide-y divide-gray-200">
    <thead class="bg-gray-50">
      <tr>
        <th class="px-6 py-3 text-left text-sm font-medium text-gray-500 uppercase tracking-wider">Title</th>
        <th class="px-6 py-3 text-left text-sm font-medium text-gray-500 uppercase tracking-wider">Type</th>
        <th class="px-6 py-3 text-left text-sm font-medium text-gray-500 uppercase tracking-wider">Tags</th>
        <th class="px-6 py-3 text-left text-sm font-medium text-gray-500 uppercase tracking-wider">Content</th>
      </tr>
    </thead>

    <tbody class="bg-white divide-y divide-gray-200">
      {{range .Writings}}
      <tr class="odd:bg-gray-200">
        <td class="px-6 py-4">
          <div class="text-base font-medium text-gray-900 max-w-125 break-all">{{.Title}}</div>
        </td>
        <td class="px-6 py-4">
          <div class="text-base font-semibold text-slate-500 max-w-125 break-all">
            {{.Type}}
          </div>
        </td>
        <td class="px-6 py-4 max-w-75">
          <div class="text-sm text-gray-900">
            {{if .Tags}}
            {{range $i, $tag := split .Tags ","}}
            <span class="inline-block bg-gray-100 text-gray-700 px-2 py-1 rounded text-sm mr-1 mb-1">{{$tag}}</span>
            {{end}}
            {{else}}
            <span class="text-gray-400">No tags</span>
            {{end}}
          </div>
        </td>
        <td class="px-6 py-4">
          <div class="text-base text-gray-500 max-w-md line-clamp-3">{{.Content}}</div>
        </td>
      </tr>
      {{end}}
    </tbody>
  </table>
  {{else}}
  <div class="p-6 text-sm text-gray-500">No writings found.</div>
  {{end}}
</div>
{{end}}
