{{define "opensource-form"}}
<div class="mb-8">
  <div class="flex items-center justify-between">
    <div class="text-white">
      {{if .IsEdit}}
      <h1 class="text-3xl font-bold">Edit Contribution</h1>
      <p class="mt-2">Update your contribution</p>
      {{else}}
      <h1 class="text-3xl font-bold">New Contribution</h1>
      <p class="mt-2">Add a new open source contribution</p>
      {{end}}
    </div>
    <a href="/nimda/os-contributions" class="text-white hover:text-amber-100">← Back to contributions</a>
  </div>
</div>

{{if .Error}}
<div class="bg-red-50 border border-red-200 rounded-lg p-4 mb-6">
  <p class="text-red-800">{{.Error}}</p>
</div>
{{end}}

<form method="POST" {{if .IsEdit}} action="/nimda/os-contributions/{{.ID}}" {{else}} action="/nimda/os-contributions"
  {{end}} class="bg-white rounded-lg shadow">
  <div class="p-6 space-y-6">
    <!-- Project Name -->
    <div>
      <label for="project_name" class="block text-sm font-medium text-gray-700 mb-2">Project Name *</label>
      <input type="text" id="project_name" name="project_name" value="{{.Contribution.ProjectName}}" required
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
        placeholder="Enter project name">
    </div>

    <!-- Description -->
    <div>
      <label for="description" class="block text-sm font-medium text-gray-700 mb-2">Description</label>
      <textarea id="description" name="description" rows="4"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
        placeholder="The full description of the project">{{.Contribution.Description}}</textarea>
    </div>

    <!-- Home Page Description -->
    <div>
      <label for="home_page_description" class="block text-sm font-medium text-gray-700 mb-2">Home Page
        Description</label>
      <textarea id="home_page_description" name="home_page_description" rows="4"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
        placeholder="A short description of the project if the project is selected to be shown in the home page.">{{.Contribution.HomePageDescription}}</textarea>
    </div>

    <!-- Link -->
    <div>
      <label for="link" class="block text-sm font-medium text-gray-700 mb-2">Project Link</label>
      <input type="url" id="link" name="link" value="{{.Contribution.Link}}"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
        placeholder="https://github.com/username/project">
    </div>

    <!-- Contribution Summary -->
    <div>
      <label for="contribution_summary" class="block text-sm font-medium text-gray-700 mb-2">Contribution
        Summary</label>
      <textarea id="contribution_summary" name="contribution_summary" rows="6"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
        placeholder="Describe your contributions to this project">{{.Contribution.ContributionSummary}}</textarea>
    </div>

    <!-- Tags -->
    <div>
      <label for="tags" class="block text-sm font-medium text-gray-700 mb-2">Tags</label>
      <input type="text" id="tags" name="tags" value="{{.Contribution.Tags}}"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
        placeholder="tag1, tag2, tag3">
      <p class="text-sm text-gray-500 mt-1">Comma-separated tags</p>
    </div>
  </div>

  <div class="px-6 py-4 bg-gray-50 border-t border-gray-200 flex justify-between">
    <a href="/nimda/os-contributions"
      class="px-4 py-2 text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50">
      Cancel
    </a>
    <div>
      <a href="/nimda/os-contributions/{{.ID}}/preview" target="_blank"
        class="px-4 py-2 mr-2 text-white bg-purple-500 border border-gray-300 rounded-lg hover:bg-purple-700">
        Preview
      </a>
      <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">
        {{if .IsEdit}}Update{{else}}Create{{end}} Contribution
      </button>
    </div>
  </div>
</form>
{{end}}
