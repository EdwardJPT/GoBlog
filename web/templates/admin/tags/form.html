{{define "tags-form"}}
<div class="mb-8">
  <div class="flex items-center justify-between">
    <div class="text-white">
      <h1 class="text-3xl font-bold">Rename Tag</h1>
      <p class="mt-2">Update this tag globally across all content</p>
    </div>
    <a href="/nimda/tags" class="text-white hover:text-amber-100">← Back to tags</a>
  </div>
</div>

<form method="POST" action="/nimda/tags/{{.TagName}}" class="bg-white rounded-lg shadow">
  <div class="p-6 space-y-6">
    
    <!-- Current Name (Disabled) -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Current Tag Name</label>
      <input type="text" value="{{.TagName}}" disabled
        class="w-full px-4 py-2 border border-gray-200 rounded-lg bg-gray-100 text-gray-500 cursor-not-allowed">
    </div>

    <!-- New Name -->
    <div>
      <label for="new_name" class="block text-sm font-medium text-gray-700 mb-2">New Tag Name *</label>
      <input type="text" id="new_name" name="new_name" value="{{.TagName}}" required
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
        placeholder="Enter new tag name">
      <p class="text-sm text-gray-500 mt-1">
        This will update the tag's text inside the comma-separated strings of all posts, bookmarks, notes, projects, and open source records.
      </p>
    </div>

  </div>

  <div class="px-6 py-4 bg-gray-50 border-t border-gray-200 flex justify-between">
    <a href="/nimda/tags" class="px-4 py-2 text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50">
      Cancel
    </a>
    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 shadow-sm">
      Save Changes
    </button>
  </div>
</form>
{{end}}
