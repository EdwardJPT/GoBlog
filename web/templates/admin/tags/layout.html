{{define "tags-layout"}}
<!DOCTYPE html>
<html lang="en">

<head>
  <title>EdwardJPT | Tags</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="EdwardJPT's website page">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="icon" href="/static/images/logo.webp">
  <link rel="stylesheet" type="text/css" href="/static/css/output.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
</head>

<body>
  <div class="flex min-h-screen w-screen flex-col items-center bg-background font-sans">

    <!-- Logout Button (Top Right) -->
    <div class="absolute top-6 right-6">
      <a href="/nimda/logout"
        class="flex items-center gap-2 px-5 py-2.5 text-base font-medium text-white bg-red-600 rounded-lg hover:bg-red-700 transition-colors shadow-md">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
        Logout
      </a>
    </div>

    <div class="mt-30 mb-20 flex flex-col items-center">
      <a href="/nimda/dashboard" class="text-4xl font-bold text-white">
        Blog Dashboard
      </a>
      <p class="text-white text-lg mt-2">Contents, Stats, and Activity</p>
    </div>

    <!-- Statistics Cards -->
    {{template "stats-card" .}}

    <div class="w-7xl my-5 bg-white h-px"></div>

    <!-- The Features -->
    <div class="flex-1 overflow-y-auto">
      <div class="p-8 min-w-4xl">
        {{if eq .SectionType "tags-list"}}
          {{template "tags-list" .}}
        {{else if eq .SectionType "tags-form"}}
          {{template "tags-form" .}}
        {{end}}
      </div>
    </div>
  </div>

  <footer class="bg-background">
    {{template "footer" .}}
  </footer>
</body>
</html>
{{end}}
