{{define "tags-list"}}
<div class="w-full">
  <div class="mb-8 w-full">
    <div class="flex items-center justify-between">
      <div>
        <h1 class="text-3xl font-bold text-white">Tags</h1>
        <p class="text-base text-white mt-2">Manage your tags</p>
      </div>
    </div>
  </div>

  <!-- Source Filter -->
  <form method="GET" action="" class="flex bg-white rounded-lg shadow p-6 mb-6 flex-col sm:flex-row gap-4 w-full">
    <!-- Search -->
    <div class="flex-1">
      <input type="text" name="q" placeholder="Search..."
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
    </div>

    <!-- Custom Dropdown -->
    <div class="relative">
      <button type="button" id="type-button"
        class="w-64 flex items-center justify-between px-4 py-2 border border-gray-300 rounded-lg bg-white hover:bg-gray-50 focus:ring-2 focus:ring-blue-500">

        <span id="type-label">Content Type</span>

        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"
          stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
        </svg>
      </button>

      <!-- Dropdown -->
      <div id="type-menu"
        class="hidden absolute left-0 mt-2 w-64 bg-white border border-gray-300 rounded-lg shadow-lg z-50">

        <label class="flex items-center gap-3 px-4 py-3 hover:bg-gray-100 cursor-pointer">
          <input type="checkbox" name="type" value="posts" class="type-checkbox">
          <span>Posts</span>
        </label>

        <label class="flex items-center gap-3 px-4 py-3 hover:bg-gray-100 cursor-pointer">
          <input type="checkbox" name="type" value="notes" class="type-checkbox">
          <span>Notes</span>
        </label>

        <label class="flex items-center gap-3 px-4 py-3 hover:bg-gray-100 cursor-pointer">
          <input type="checkbox" name="type" value="bookmarks" class="type-checkbox">
          <span>Bookmarks</span>
        </label>

        <label class="flex items-center gap-3 px-4 py-3 hover:bg-gray-100 cursor-pointer">
          <input type="checkbox" name="type" value="projects" class="type-checkbox">
          <span>Projects</span>
        </label>

        <label class="flex items-center gap-3 px-4 py-3 hover:bg-gray-100 cursor-pointer">
          <input type="checkbox" name="type" value="opensource_contributions" class="type-checkbox">
          <span>Open Source</span>
        </label>

      </div>
    </div>

    <!-- Search Button -->
    <button type="submit" class="bg-hover text-white px-4 py-2 rounded-lg hover:bg-gray-700 transition-colors">
      Search
    </button>
  </form>

  <!-- Tags Table -->
  <div class="flex flex-wrap justify-center gap-3 max-w-4xl mx-auto w-full">
    {{range .Tags}}
    <div
      class="group flex w-fit items-center p-2 text-white bg-hover hover:bg-hover/75 font-medium hover:font-semibold transition cursor-pointer rounded">
      <a href="/tag/{{.Name}}" class="flex items-center">
        <span class="text-base">{{.Name}}</span>
        <span class="ml-2 text-sm">{{.Count}}</span>
      </a>
      <a href="/nimda/tags/{{.Name}}/edit"
        class="hidden group-hover:flex ml-2 items-center justify-center py-1 px-2 text-xs bg-white/20 hover:bg-white/40 rounded transition cursor-pointer">
        Edit
      </a>
      <button onclick="confirmDelete('tags', {{.Name}})"
        class="hidden group-hover:flex ml-2 items-center justify-center py-1 px-2 text-xs bg-white/20 hover:bg-white/40 rounded transition cursor-pointer">
        Delete
      </button>
    </div>
    {{else}}
    <div class="w-full">
      <div class="bg-white rounded-lg shadow overflow-hidden w-full">
        <div class="p-6 text-sm text-gray-500 text-center">No tags found.</div>
      </div>
    </div>
    {{end}}
  </div>
</div>

<!-- Delete Confirmation Modal -->
<div id="delete-modal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden items-center justify-center z-50">
  <div class="bg-white rounded-lg p-6 max-w-sm mx-4">
    <h3 class="text-lg font-medium text-gray-900 mb-2">Confirm Delete</h3>
    <p class="text-gray-600 mb-6">Are you sure you want to delete this tag? It will be removed from all posts,
      bookmarks, notes, and projects. This action cannot be undone.</p>
    <div class="flex justify-end space-x-3">
      <button onclick="closeDeleteModal()"
        class="px-4 py-2 text-gray-700 bg-gray-200 rounded-lg hover:bg-gray-300">Cancel</button>
      <form id="delete-form" method="POST">
        <button type="submit" class="px-4 py-2 text-white bg-red-600 rounded-lg hover:bg-red-700">Delete</button>
      </form>
    </div>
  </div>
</div>

<script>
  function confirmDelete(type, name) {
    document.getElementById('delete-form').action = `/nimda/${type}/${name}/delete`;
    document.getElementById('delete-modal').classList.remove('hidden');
    document.getElementById('delete-modal').classList.add('flex');
  }

  function closeDeleteModal() {
    document.getElementById('delete-modal').classList.add('hidden');
    document.getElementById('delete-modal').classList.remove('flex');
  }

  document.addEventListener("DOMContentLoaded", () => {
    const button = document.getElementById("type-button");
    const menu = document.getElementById("type-menu");
    const label = document.getElementById("type-label");
    const checkboxes = document.querySelectorAll(".type-checkbox");

    function updateLabel() {
      const selected = [...checkboxes]
        .filter(cb => cb.checked)
        .map(cb => cb.parentElement.querySelector("span").textContent.trim());

      if (selected.length === 0) {
        label.textContent = "Content Type";
      } else if (selected.length <= 2) {
        label.textContent = selected.join(", ");
      } else {
        label.textContent = `${selected.length} selected`;
      }
    }

    // Restore checkbox state from URL
    const urlParams = new URLSearchParams(window.location.search);
    const types = urlParams.getAll("type");

    if (types.length === 0) {
      // No filter in URL = all selected
      checkboxes.forEach(cb => cb.checked = true);
    } else {
      checkboxes.forEach(cb => {
        cb.checked = types.includes(cb.value);
      });
    }

    // Update dropdown text based on restored state
    updateLabel();

    // Toggle dropdown
    button.addEventListener("click", () => {
      menu.classList.toggle("hidden");
    });

    // Close dropdown when clicking outside
    document.addEventListener("click", (e) => {
      if (!button.contains(e.target) && !menu.contains(e.target)) {
        menu.classList.add("hidden");
      }
    });

    // Update label when checkboxes change
    checkboxes.forEach(cb => {
      cb.addEventListener("change", () => {
        updateLabel();
      });
    });
  });
</script>
{{end}}
