<!DOCTYPE html>
<html lang="en">

<head>
  <title>500 Internal Server Error - EdwardJPT</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="icon" href="/static/images/logo-for-page.png">
  <link rel="stylesheet" type="text/css" href="/static/css/output.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* Kept only the essential layout and animation logic for the server illustration */
    .server-container {
      position: relative;
      width: 200px;
      height: 200px;
      margin: 0 auto;
    }

    .server {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .server-body {
      width: 140px;
      height: 100px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .server-lights {
      display: flex;
      position: absolute;
      top: 15px;
      gap: 12px;
    }

    .light {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      animation: blink 1.5s infinite;
    }

    .light:nth-child(2) {
      animation-delay: 0.3s;
    }

    .light:nth-child(3) {
      animation-delay: 0.6s;
    }

    .server-bottom {
      width: 160px;
      height: 20px;
      margin-top: -5px;
      position: relative;
    }

    .server-bottom::before {
      content: "";
      position: absolute;
      top: -10px;
      left: 20px;
      width: 120px;
      height: 10px;
      border-radius: 5px;
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.2;
      }
    }
  </style>
</head>

<body class="flex min-h-screen w-full flex-col items-center justify-center bg-background font-sans text-slate-200">

  <!-- Main container matching your app's layout styles -->
  <div
    class="flex flex-col w-[95%] max-w-4xl p-6 md:p-12 items-center justify-center text-center bg-lighter_background border border-slate-50 relative overflow-hidden min-h-[85vh]">

    <!-- Header Typography -->
    <div class="text-8xl md:text-[10rem] font-bold tracking-tight text-white leading-none mb-4">500</div>
    <h1
      class="text-3xl md:text-4xl font-bold tracking-tight text-indigo-100 mb-4 hover:text-indigo-200 transition-colors">
      Internal Server Error
    </h1>
    <p class="text-slate-400 text-sm md:text-lg font-bold max-w-160 mb-0">
      I'm sorry, but there was a problem with the server.
    </p>

    <!-- Server Animation (Styled with Tailwind Colors) -->
    <div class="server-container mb-10">
      <div class="server">
        <div class="server-body bg-white/5 border border-white/10 rounded-lg shadow-xl shadow-black/50">
          <div class="server-lights">
            <!-- Red lights mapped to tailwind colors to indicate an error -->
            <div class="light bg-red-500 shadow-[0_0_10px_#ef4444]"></div>
            <div class="light bg-red-500 shadow-[0_0_10px_#ef4444]"></div>
            <div class="light bg-red-500 shadow-[0_0_10px_#ef4444]"></div>
          </div>
        </div>
        <div class="server-bottom bg-black/40 rounded-b-lg before:bg-black/40"></div>
      </div>
    </div>

    <!-- Suggestions Panel mapped to your article card hover styles -->
    <div
      class="w-full max-w-lg border border-slate-50 p-6 flex flex-col justify-start text-left bg-white/5 hover:bg-hover transition-all duration-300 group relative mb-10">
      <h3 class="text-lg md:text-xl font-bold text-white mb-4 group-hover:text-indigo-200 transition-colors">
        What you can try:
      </h3>
      <ul class="space-y-3 text-sm md:text-base text-gray-300 font-medium">
        <li class="flex items-start gap-3">
          <span class="text-indigo-400 font-bold mt-0.5">•</span>
          Refresh the page in a few minutes
        </li>
        <li class="flex items-start gap-3">
          <span class="text-indigo-400 font-bold mt-0.5">•</span>
          Check your internet connection
        </li>
        <li class="flex items-start gap-3">
          <span class="text-indigo-400 font-bold mt-0.5">•</span>
          Try again later when our servers are back online
        </li>
      </ul>
    </div>

    <!-- Primary action button -->
    <button onclick="window.location.reload()"
      class="cursor-pointer group relative inline-flex items-center justify-center px-8 py-3 text-base font-medium text-white bg-white/10 border border-white/20 overflow-hidden transition-all duration-300 hover:bg-white hover:text-[#0a144b] hover:font-extrabold hover:shadow-xl hover:shadow-slate-900/20 focus:outline-none">
      <svg class="w-4 h-4 mr-2 transform group-hover:rotate-180 transition-transform duration-500" fill="none"
        stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15">
        </path>
      </svg>
      <span>Refresh Page</span>
    </button>

  </div>

</body>

</html>
